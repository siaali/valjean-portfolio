<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work</title>
<meta name="description" content="Work detail.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-work">

<header class="site-header">
  <a class="brand has-tip" href="index.html" data-site-name data-tip="Home">Portfolio</a>
  <nav class="site-nav">
    <a class="has-tip" href="index.html#work" data-tip="View work">Work</a>
    <a class="has-tip" href="index.html#info" data-tip="About">Info</a>
    <a class="has-tip" href="mailto:" data-email-link data-tip="Email">Contact</a>
  </nav>
</header>

<main class="detail" id="detail">
  <div class="detail-head">
    <a class="back-link" href="index.html#work"><span aria-hidden="true">←</span> All work</a>
    <h1 class="detail-title" id="dTitle"></h1>
    <div class="detail-meta" id="dMeta"></div>
  </div>

  <div class="player-wrap">
    <div class="players" id="players"></div>
  </div>

  <p class="detail-note" id="dNote"></p>

  <section class="stills" id="stillsSection" hidden>
    <p class="stills-label" data-stills-label>Selected frames</p>
    <div class="stills-grid" id="stillsGrid"></div>
  </section>

  <a class="next-work" id="nextWork" href="index.html#work">
    <span class="next-label">Next work</span>
    <span class="next-title" id="nextTitle"></span>
    <span class="next-arrow" aria-hidden="true">↗</span>
  </a>
</main>

<footer class="site-footer site-footer--compact">
  <div class="footer-bottom">
    <span class="footer-name" data-site-name></span>
    <div class="social" id="social"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" type="button" aria-label="Close">×</button>
  <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous">‹</button>
  <img class="lb-image" id="lbImage" alt="">
  <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next">›</button>
  <p class="lb-count" id="lbCount"></p>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
