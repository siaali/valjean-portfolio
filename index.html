<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALJEAN — Director / Creative / Editor</title>
<meta name="description" content="Selected moving images — fashion & creative film. By VALJEAN, independent filmmaker and image-maker in Shanghai.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://valjeanfilms.com/">
<meta property="og:site_name" content="VALJEAN">
<meta property="og:title" content="VALJEAN — Director / Creative / Editor">
<meta property="og:description" content="Selected moving images — fashion & creative film.">
<meta property="og:image" content="https://valjeanfilms.com/assets/img/share-cover.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VALJEAN — Director / Creative / Editor">
<meta name="twitter:description" content="Selected moving images — fashion & creative film.">
<meta name="twitter:image" content="https://valjeanfilms.com/assets/img/share-cover.jpg">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-home">

<header class="site-header">
  <a class="brand has-tip" href="index.html" data-site-name data-tip="Home">Portfolio</a>
  <nav class="site-nav">
    <a class="has-tip" href="#work" data-tip="View work">Work</a>
    <a class="has-tip" href="#info" data-tip="About">Info</a>
    <a class="has-tip" href="mailto:" data-email-link data-tip="Email">Contact</a>
  </nav>
</header>

<section class="hero" id="top">
  <div class="hero-media" id="heroMedia"></div>
  <div class="hero-shade"></div>
  <div class="hero-inner">
    <h1 class="hero-title" data-site-name>Portfolio</h1>
    <p class="hero-tagline" data-site-tagline></p>
  </div>
</section>

<main>
  <section class="work-section" id="work">
    <div class="section-head">
      <h2 class="section-label">WORK</h2>
      <div class="section-tools">
        <span class="all-label">All</span>
        <div class="view-switch" id="viewSwitch" role="group" aria-label="View options">
          <button type="button" class="view-btn is-active" data-view="flow" data-tip="Large view" aria-label="Large stacked images" aria-pressed="true">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="3" width="16" height="6" rx="1"/><rect x="2" y="11" width="16" height="6" rx="1"/></svg>
          </button>
          <button type="button" class="view-btn" data-view="grid" data-tip="Grid view" aria-label="Grid view" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1"/><rect x="11" y="2" width="7" height="7" rx="1"/><rect x="2" y="11" width="7" height="7" rx="1"/><rect x="11" y="11" width="7" height="7" rx="1"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="grid-empty" id="gridEmpty" hidden>No work in this category yet.</p>
  </section>

  <section class="info" id="info">
    <div class="info-inner">
      <p class="info-label">( About me )</p>
      <div class="info-grid">
        <figure class="info-portrait" data-site-portrait-wrap>
          <img data-site-portrait alt="Portrait">
        </figure>
        <div class="info-body">
          <p class="info-loc" data-site-location></p>
          <p class="info-about" data-site-about></p>
          <ul class="services" id="services"></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="footer-talk">
    <p class="footer-pretitle">Let's talk</p>
    <a class="footer-email" data-email-link href="mailto:" data-email-text></a>
    <button class="copy-btn" id="copyEmail" type="button">Copy Email</button>
  </div>
  <div class="footer-bottom">
    <span class="footer-name" data-site-name></span>
    <div class="social" id="social"></div>
  </div>
</footer>

<script src="assets/js/app.js"></script>
</body>
</html>
